server {
        # listen on port 80
        listen 80;
        # save logs here
        access_log /var/log/nginx/access.log main;
        # where the site files are
        root /usr/share/nginx/html;
        # what file to serve as index
        index index.html index.htm;

        location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to redirecting to index.html
            try_files $uri $uri/ /index.html;
        }

        # Sentry envelope tunnel. Proxies through our own origin so adblockers
        # (which block the Sentry ingest host) don't drop feedback/errors.
        # Keep in sync with `tunnel` in src/index.tsx and the DSN in .env.
        location = /feedback {
            proxy_pass https://o553498.ingest.us.sentry.io/api/4507775325437952/envelope/;
            proxy_ssl_server_name on;
            proxy_set_header Host o553498.ingest.us.sentry.io;
        }

        # Media: images, icons, video, audio, HTC
        location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
          expires 1M;
          access_log off;
          add_header Cache-Control "public";
        }

        # Javascript and CSS files
        location ~* \.(?:css|js)$ {
            try_files $uri =404;
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        # Any route containing a file extension (e.g. /devicesfile.js)
        location ~ ^.+\..+$ {
            try_files $uri =404;
        }
    }

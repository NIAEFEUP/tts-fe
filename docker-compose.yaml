services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tts
      POSTGRES_PASSWORD: tts
      POSTGRES_DB: tts
    ports:
      # Bound to loopback only: dev credentials (tts/tts) must not be
      # reachable from other machines on the network.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

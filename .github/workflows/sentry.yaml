name: Sentry Release

on:
  push:
    branches:
      - main
      - develop

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: sentry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Determine release version (default to commit hash)
        id: get_version
        run: |
          VERSION=$(git rev-parse --short HEAD)

          # Override version if on main branch to use package.json version
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            VERSION=$(jq -r .version < package.json)
          fi

          echo "Version to be released: $VERSION"
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and Finalize Sentry Release
        uses: getsentry/action-release@v1
        with:
          environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          version: ${{ steps.get_version.outputs.release_version }}
          ignore_missing: true
          sourcemaps: ./dist
          finalize: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

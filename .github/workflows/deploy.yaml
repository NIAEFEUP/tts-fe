on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  deploy:
    name: "Wait for Netlify Preview"
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Netlify Preview
        uses: kamranayub/wait-for-netlify-action@v2.1.0
        id: waitForNetlify
        continue-on-error: true
        with:
          site_name: 'tts-fe-preview'
          max_timeout: 300
          verbose: true
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}

      - name: Find existing preview comment
        if: github.event_name == 'pull_request' && steps.waitForNetlify.outputs.url != ''
        uses: actions/github-script@v7
        id: find_comment
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Netlify Preview disponível')
            );
            return existing ? existing.id : '';

      - name: Create or update preview comment
        if: github.event_name == 'pull_request' && steps.waitForNetlify.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🌐 **Netlify Preview disponível:**\n${{ steps.waitForNetlify.outputs.url }}`;
            const commentId = ${{ steps.find_comment.outputs.result }};
            if (commentId) {
              await github.rest.issues.updateComment({
                comment_id: commentId,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
